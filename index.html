<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ValoBot — Documentation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0c0c0a;
      --bg-sidebar:#0a0a09;
      --bg-elev:#141311;
      --bg-code:#100f0d;
      --border:#252320;
      --border-soft:#1b1a18;
      --text:#ece9e3;
      --text-dim:#9a958c;
      --text-faint:#6b6760;
      --accent:#ffd24a;
      --accent-dim:#8a7226;
      --accent-glow:rgba(255,210,74,.12);
      --green:#3ecf8e;
      --red:#e05c5c;
      --blue:#5c90e8;
      --radius:10px;
      --radius-sm:7px;
      --sidebar-w:264px;
      --font-head:'Space Grotesk',sans-serif;
      --font-body:'Inter',system-ui,sans-serif;
      --font-mono:'JetBrains Mono',ui-monospace,monospace;
    }
    :root[data-theme="light"]{
      --bg:#ffffff;
      --bg-sidebar:#fbfaf8;
      --bg-elev:#f6f4f0;
      --bg-code:#f6f4f0;
      --border:#e3dfd8;
      --border-soft:#eceae5;
      --text:#16150f;
      --text-dim:#5f5b53;
      --text-faint:#8a857c;
      --accent:#a37b00;
      --accent-dim:#d8c07a;
      --accent-glow:rgba(163,123,0,.09);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      background:var(--bg);
      color:var(--text);
      font-family:var(--font-body);
      font-size:15px;
      line-height:1.65;
      -webkit-font-smoothing:antialiased;
    }
    a{color:inherit;text-decoration:none}
    button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
    svg{display:block}
    :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

    /* ---------- Topbar ---------- */
    .topbar{
      position:fixed;top:0;left:0;right:0;height:56px;z-index:40;
      display:flex;align-items:center;gap:16px;
      padding:0 20px;
      background:var(--bg-sidebar);
      border-bottom:1px solid var(--border-soft);
    }
    .brand{display:flex;align-items:center;gap:9px;font-family:var(--font-head);font-weight:700;font-size:16px;letter-spacing:-.01em}
    .brand .mark{
      width:26px;height:26px;border-radius:7px;
      display:grid;place-items:center;
      background:var(--accent);color:#0c0c0a;flex-shrink:0;
    }
    .brand .mark svg{width:16px;height:16px}
    .brand em{font-style:normal;color:var(--text-faint);font-weight:500}
    .topbar-nav{margin-left:auto;display:flex;align-items:center;gap:4px}
    .topbar-nav a{
      padding:6px 11px;border-radius:var(--radius-sm);
      font-size:14px;color:var(--text-dim);
    }
    .topbar-nav a:hover{color:var(--text);background:var(--bg-elev)}
    .topbar-nav a.pill{border:1px solid var(--border);color:var(--text)}
    .burger{display:none;width:34px;height:34px;border-radius:var(--radius-sm);place-items:center}
    .burger:hover{background:var(--bg-elev)}

    /* ---------- Sidebar ---------- */
    .sidebar{
      position:fixed;top:56px;bottom:0;left:0;width:var(--sidebar-w);z-index:30;
      background:var(--bg-sidebar);
      border-right:1px solid var(--border-soft);
      display:flex;flex-direction:column;
    }
    .search-wrap{padding:14px 16px 8px}
    .search{
      display:flex;align-items:center;gap:8px;width:100%;
      padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);
      background:var(--bg-elev);color:var(--text-faint);font-size:13.5px;
    }
    .search:hover{border-color:var(--accent-dim)}
    .search svg{width:15px;height:15px;flex-shrink:0}
    .search input{
      flex:1;min-width:0;background:none;border:none;outline:none;
      color:var(--text);font:inherit;
    }
    .search input::placeholder{color:var(--text-faint)}
    .search kbd{
      font-family:var(--font-mono);font-size:10.5px;
      padding:2px 5px;border:1px solid var(--border);border-radius:4px;
      color:var(--text-faint);flex-shrink:0;
    }
    .nav{flex:1;overflow-y:auto;padding:8px 10px 24px}
    .nav-group{margin-bottom:18px}
    .nav-group h4{
      font-family:var(--font-head);font-size:13px;font-weight:600;
      color:var(--text);padding:6px 10px;
    }
    .nav-item{
      display:flex;align-items:center;gap:9px;width:100%;
      padding:6.5px 10px;border-radius:var(--radius-sm);
      font-size:14px;color:var(--text-dim);text-align:left;
      transition:background .12s ease,color .12s ease;
    }
    .nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.75}
    .nav-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .nav-item:hover{color:var(--text);background:var(--bg-elev)}
    .nav-item.active{
      background:var(--accent-glow);color:var(--accent);font-weight:600;
    }
    .nav-item.active svg{opacity:1}
    .nav-empty{padding:10px;font-size:13.5px;color:var(--text-faint)}
    .sidebar-foot{
      border-top:1px solid var(--border-soft);
      padding:10px 16px;display:flex;align-items:center;gap:6px;
    }
    .icon-btn{width:30px;height:30px;border-radius:var(--radius-sm);display:grid;place-items:center;color:var(--text-faint)}
    .icon-btn svg{width:16px;height:16px}
    .icon-btn:hover{background:var(--bg-elev);color:var(--text)}
    .icon-btn.on{color:var(--accent)}
    .sidebar-foot .ver{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--text-faint)}

    /* ---------- Main ---------- */
    .main{margin-left:var(--sidebar-w);padding-top:56px;min-height:100vh}
    .page{max-width:780px;padding:52px 48px 96px}
    .eyebrow{
      font-family:var(--font-head);font-weight:600;font-size:14px;
      color:var(--accent);margin-bottom:10px;
    }
    .page-head{display:flex;align-items:flex-start;gap:24px;flex-wrap:wrap}
    h1{
      font-family:var(--font-head);font-weight:700;font-size:42px;
      line-height:1.12;letter-spacing:-.025em;flex:1;min-width:260px;
    }
    h1 .slash{color:var(--text-faint);font-weight:500}
    .copy-page{
      display:flex;align-items:center;gap:8px;
      padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius);
      background:var(--bg-elev);font-size:13.5px;color:var(--text-dim);
      margin-top:6px;
    }
    .copy-page:hover{color:var(--text);border-color:var(--accent-dim)}
    .copy-page svg{width:15px;height:15px}
    .summary{margin-top:20px;font-size:16.5px;color:var(--text-dim);line-height:1.7}
    .meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
    .chip{
      display:inline-flex;align-items:center;gap:6px;
      padding:4px 10px;border:1px solid var(--border);border-radius:100px;
      font-size:12.5px;color:var(--text-dim);
    }
    .chip svg{width:13px;height:13px;opacity:.8}
    .chip.accent{border-color:var(--accent-dim);color:var(--accent)}

    h2{
      font-family:var(--font-head);font-weight:600;font-size:20px;
      letter-spacing:-.015em;margin:44px 0 14px;
      padding-top:22px;border-top:1px solid var(--border-soft);
    }
    h2:first-of-type{border-top:none;padding-top:0}
    .prose p{margin-bottom:14px;color:var(--text-dim)}
    .prose strong{color:var(--text);font-weight:600}
    .prose ul{list-style:none;margin:6px 0 16px}
    .prose li{position:relative;padding-left:20px;margin-bottom:8px;color:var(--text-dim)}
    .prose li::before{
      content:"";position:absolute;left:4px;top:10px;
      width:5px;height:5px;border-radius:50%;background:var(--accent-dim);
    }
    .prose a{color:var(--accent);border-bottom:1px solid var(--accent-dim);font-weight:500}
    code{
      font-family:var(--font-mono);font-size:.875em;
      background:var(--bg-elev);border:1px solid var(--border-soft);
      padding:1.5px 5px;border-radius:5px;color:var(--text);
    }

    /* code block */
    .code{
      position:relative;background:var(--bg-code);
      border:1px solid var(--border);border-radius:var(--radius);
      margin:12px 0 18px;overflow:hidden;
    }
    .code-cap{
      display:flex;align-items:center;gap:8px;
      padding:8px 14px;border-bottom:1px solid var(--border-soft);
      font-size:12.5px;color:var(--text-faint);
    }
    .code-cap svg{width:14px;height:14px}
    .code pre{
      padding:14px;overflow-x:auto;
      font-family:var(--font-mono);font-size:13.5px;line-height:1.6;color:var(--text);
    }
    .code .cmd{color:var(--accent)}
    .code .arg{color:var(--blue)}
    .code-copy{
      position:absolute;top:8px;right:8px;
      width:30px;height:30px;border-radius:6px;display:grid;place-items:center;
      color:var(--text-faint);background:var(--bg-code);
    }
    .code-copy:hover{color:var(--text);background:var(--bg-elev)}
    .code-copy svg{width:15px;height:15px}
    .code-cap + .code-copy{top:42px}

    /* params table */
    .params{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:18px}
    .param{padding:14px 16px;border-bottom:1px solid var(--border-soft)}
    .param:last-child{border-bottom:none}
    .param-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .param-name{font-family:var(--font-mono);font-size:13.5px;color:var(--text);font-weight:500}
    .param-type{font-family:var(--font-mono);font-size:12px;color:var(--blue)}
    .tag{
      font-size:11px;padding:1.5px 7px;border-radius:100px;
      border:1px solid currentColor;line-height:1.5;
    }
    .tag.req{color:var(--red)}
    .tag.opt{color:var(--text-faint)}
    .param p{margin-top:5px;font-size:14px;color:var(--text-dim)}
    .param .def{margin-top:4px;font-size:12.5px;color:var(--text-faint)}

    /* callout */
    .callout{
      display:flex;gap:11px;padding:13px 15px;
      border:1px solid var(--border);border-left:2px solid var(--accent);
      border-radius:var(--radius);background:var(--bg-elev);
      margin-bottom:12px;font-size:14px;color:var(--text-dim);
    }
    .callout svg{width:17px;height:17px;flex-shrink:0;margin-top:2px;color:var(--accent)}
    .callout.warn{border-left-color:var(--red)}
    .callout.warn svg{color:var(--red)}
    .callout.ok{border-left-color:var(--green)}
    .callout.ok svg{color:var(--green)}

    /* prev / next */
    .pager{display:flex;gap:14px;margin-top:56px}
    .pager a{
      flex:1;padding:16px 18px;border:1px solid var(--border);border-radius:var(--radius);
      display:flex;flex-direction:column;gap:3px;
    }
    .pager a:hover{border-color:var(--accent-dim)}
    .pager .lbl{font-size:12.5px;color:var(--text-faint);display:flex;align-items:center;gap:5px}
    .pager .lbl svg{width:13px;height:13px}
    .pager .ttl{font-family:var(--font-head);font-weight:600;font-size:15px;color:var(--text)}
    .pager .next{text-align:right}
    .pager .next .lbl{justify-content:flex-end}

    .page-foot{
      margin-top:48px;padding-top:22px;border-top:1px solid var(--border-soft);
      display:flex;align-items:center;gap:14px;
      font-size:13px;color:var(--text-faint);
    }
    .page-foot .right{margin-left:auto}

    .scrim{display:none;position:fixed;inset:56px 0 0;background:rgba(0,0,0,.5);z-index:25}

    @media (max-width:1000px){
      .burger{display:grid}
      .topbar-nav a:not(.pill){display:none}
      .sidebar{transform:translateX(-100%);transition:transform .2s ease}
      body.nav-open .sidebar{transform:none}
      body.nav-open .scrim{display:block}
      .main{margin-left:0}
      .page{padding:40px 24px 80px}
      h1{font-size:32px}
      .pager{flex-direction:column}
    }
    @media (prefers-reduced-motion:reduce){
      *{transition:none!important;animation:none!important}
      html{scroll-behavior:auto}
    }
  </style>
</head>
<body>

<header class="topbar">
  <button class="burger" id="burger" aria-label="Ouvrir la navigation"></button>
  <a href="#" class="brand"><span class="mark" id="brandMark"></span>ValoBot <em>docs</em></a>
  <nav class="topbar-nav">
    <a href="#" class="active">Guides</a>
    <a href="#">Changelog</a>
    <a href="#" class="pill">Support</a>
    <a href="#" class="pill">Inviter</a>
  </nav>
</header>

<aside class="sidebar" id="sidebar">
  <div class="search-wrap">
    <label class="search">
      <span id="searchIcon"></span>
      <input type="search" id="search" placeholder="Rechercher une commande…" aria-label="Rechercher">
      <kbd>Ctrl K</kbd>
    </label>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="sidebar-foot">
    <button class="icon-btn" id="themeLight" title="Thème clair" aria-label="Thème clair"></button>
    <button class="icon-btn" id="themeDark" title="Thème sombre" aria-label="Thème sombre"></button>
    <span class="ver">v2.4.0</span>
  </div>
</aside>
<div class="scrim" id="scrim"></div>

<main class="main"><article class="page" id="page"></article></main>

<script>
  /* ============================================================
     1. ICÔNES — style Tabler, en SVG inline.
     Pour utiliser la webfont Tabler à la place, remplace le corps
     de icon() par :  return '<i class="ti ti-'+name+'"></i>';
     ============================================================ */
  const PATHS = {
    'crosshair':'<circle cx="12" cy="12" r="8"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/>',
    'search':'<circle cx="10" cy="10" r="7"/><line x1="21" y1="21" x2="15" y2="15"/>',
    'menu':'<line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/>',
    'sun':'<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M3 12h2M19 12h2M5.6 18.4L7 17M17 7l1.4-1.4"/>',
    'moon':'<path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/>',
    'copy':'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
    'check':'<path d="M5 12l5 5L20 7"/>',
    'terminal':'<path d="M5 7l5 5-5 5"/><line x1="12" y1="19" x2="19" y2="19"/>',
    'book':'<path d="M4 5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H6a2 2 0 0 1-2-2z"/><line x1="8" y1="7" x2="14" y2="7"/>',
    'rocket':'<path d="M5 13l-2 5 5-2 7-7a4 4 0 0 0 0-6 4 4 0 0 0-6 0z"/><circle cx="14" cy="10" r="1.2"/>',
    'link':'<path d="M10 14a4 4 0 0 0 6 .5l2-2a4 4 0 0 0-6-6l-1 1"/><path d="M14 10a4 4 0 0 0-6-.5l-2 2a4 4 0 0 0 6 6l1-1"/>',
    'trophy':'<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 5H5v2a3 3 0 0 0 3 3M16 5h3v2a3 3 0 0 1-3 3"/><line x1="12" y1="13" x2="12" y2="17"/><line x1="8" y1="20" x2="16" y2="20"/>',
    'chart':'<line x1="4" y1="20" x2="20" y2="20"/><rect x="6" y="12" width="3" height="6"/><rect x="11" y="8" width="3" height="10"/><rect x="16" y="4" width="3" height="14"/>',
    'swords':'<path d="M5 3l8 8-2 2-8-8V3z"/><path d="M19 3l-8 8 2 2 8-8V3z"/><path d="M14 16l4 4M10 16l-4 4"/>',
    'user':'<circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/>',
    'map':'<path d="M9 5L4 7v12l5-2 6 2 5-2V5l-5 2z"/><line x1="9" y1="5" x2="9" y2="17"/><line x1="15" y1="7" x2="15" y2="19"/>',
    'shopping':'<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
    'bell':'<path d="M6 10a6 6 0 0 1 12 0c0 4 2 5 2 5H4s2-1 2-5z"/><path d="M10 19a2 2 0 0 0 4 0"/>',
    'clock':'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    'shield':'<path d="M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z"/>',
    'alert':'<path d="M12 8v5"/><circle cx="12" cy="17" r=".6" fill="currentColor"/><circle cx="12" cy="12" r="9"/>',
    'info':'<circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="8" r=".6" fill="currentColor"/>',
    'bolt':'<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>',
    'left':'<path d="M14 6l-6 6 6 6"/>',
    'right':'<path d="M10 6l6 6-6 6"/>',
    'settings':'<circle cx="12" cy="12" r="3"/><path d="M12 3l1.5 2.5 2.9-.4 1 2.8 2.6 1.4-1 2.7 1 2.7-2.6 1.4-1 2.8-2.9-.4L12 21l-1.5-2.5-2.9.4-1-2.8L4 14.7l1-2.7-1-2.7 2.6-1.4 1-2.8 2.9.4z"/>',
    'sparkles':'<path d="M12 3l1.8 4.7L18.5 9.5 13.8 11.3 12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8z"/>'
  };
  function icon(name){
    const p = PATHS[name] || PATHS['book'];
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" '+
            'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
  }

  /* ============================================================
     2. CONTENU — c'est le SEUL endroit à modifier.
     Ajoute un objet dans items[] : la sidebar, la recherche,
     la page et la navigation précédent/suivant suivent seules.

     Champs disponibles (tous optionnels sauf id + title) :
       id, title, icon, summary
       usage        : string        → bloc de commande
       params       : [{name,type,required,description,default}]
       examples     : [{code,caption}]
       returns      : string (html)
       cooldown, scope, permission  → pastilles sous le titre
       notes        : [{type:'info'|'warn'|'ok', text}]
       body         : html libre (pour les pages de prose)
     ============================================================ */
  const DOCS = [
    {
      group:'Prise en main',
      items:[
        {
          id:'introduction',
          title:'Introduction',
          icon:'rocket',
          summary:'ValoBot apporte les stats Valorant dans ton serveur Discord : rang, historique de parties, agents joués et rotation de boutique, sans quitter le salon.',
          body:`
          <h2>Ce que fait le bot</h2>
          <p>ValoBot interroge l'API Riot et met en forme les résultats directement dans Discord. Toutes les commandes sont des commandes slash : tape <code>/</code> dans un salon et Discord affiche la liste avec l'autocomplétion des paramètres.</p>
          <ul>
            <li>Consulter un rang et un pic de rang sur la saison en cours</li>
            <li>Relire les dernières parties avec K/D/A et score de combat</li>
            <li>Suivre la rotation quotidienne de la boutique</li>
            <li>Comparer deux joueurs sur un même agent</li>
          </ul>
          <h2>Avant de commencer</h2>
          <p>Invite le bot, puis lie ton compte Riot une seule fois avec <code>/link</code>. Toutes les commandes accepteront ensuite d'être lancées sans pseudo.</p>
        `,
          notes:[{type:'info',text:'Le bot a besoin des permissions <strong>Envoyer des messages</strong> et <strong>Intégrer des liens</strong> dans les salons où il répond.'}]
        },
        {
          id:'installation',
          title:'Installation',
          icon:'bolt',
          summary:'Invite ValoBot sur ton serveur et vérifie que les commandes slash sont bien enregistrées.',
          body:`
          <h2>Inviter le bot</h2>
          <p>Ouvre le lien d'invitation, choisis le serveur, puis valide la liste des permissions. Il faut être <strong>administrateur</strong> du serveur pour ajouter une application.</p>
          <h2>Vérifier l'installation</h2>
          <p>Tape <code>/ping</code> dans n'importe quel salon. Si le bot répond avec sa latence, les commandes sont enregistrées. Sinon, retire puis réinvite l'application : Discord met parfois jusqu'à une heure à propager les commandes globales.</p>
        `,
          examples:[{code:'/ping',caption:'Vérifier que le bot répond'}],
          notes:[{type:'warn',text:'Si les commandes n\'apparaissent pas après une heure, vérifie que le rôle du bot n\'est pas bloqué par une permission de salon.'}]
        },
        {
          id:'link',
          title:'/link',
          icon:'link',
          summary:'Associe ton compte Riot à ton compte Discord pour lancer les autres commandes sans jamais retaper ton pseudo.',
          usage:'/link <riot_id> [région]',
          scope:'Serveur et messages privés',
          cooldown:'1 utilisation / 30 s',
          params:[
            {name:'riot_id',type:'string',required:true,description:'Ton identifiant Riot complet, au format pseudo#tag.'},
            {name:'région',type:'choice',required:false,description:'Serveur de jeu : eu, na, ap, kr, latam, br.',default:'eu'}
          ],
          examples:[
            {code:'/link riot_id:Sova#EUW',caption:'Liaison simple'},
            {code:'/link riot_id:Sova#EUW région:na',caption:'En précisant la région'}
          ],
          returns:'<p>Un message éphémère de confirmation, visible de toi seul, avec le pseudo et la région enregistrés.</p>',
          notes:[
            {type:'ok',text:'Une fois lié, <code>/rank</code>, <code>/matches</code> et <code>/stats</code> fonctionnent sans argument.'},
            {type:'info',text:'Relancer <code>/link</code> écrase la liaison précédente. Utilise <code>/unlink</code> pour supprimer tes données.'}
          ]
        }
      ]
    },
    {
      group:'Statistiques',
      items:[
        {
          id:'rank',
          title:'/rank',
          icon:'trophy',
          summary:'Affiche le rang actuel, le nombre de RR et le pic de rang de la saison pour un joueur.',
          usage:'/rank [riot_id] [région]',
          cooldown:'5 s / utilisateur',
          params:[
            {name:'riot_id',type:'string',required:false,description:'Joueur à consulter. Omis, la commande utilise ton compte lié.'},
            {name:'région',type:'choice',required:false,description:'Serveur de jeu à interroger.',default:'région du compte lié'}
          ],
          examples:[
            {code:'/rank',caption:'Ton propre rang'},
            {code:'/rank riot_id:Jett#1337',caption:'Le rang d\'un autre joueur'}
          ],
          returns:'<p>Une carte avec le rang, les RR, la progression depuis la dernière partie et le pic de rang de la saison.</p>',
          notes:[{type:'warn',text:'Un joueur sans partie classée sur la saison en cours renvoie l\'erreur <code>UNRANKED</code>.'}]
        },
        {
          id:'matches',
          title:'/matches',
          icon:'swords',
          summary:'Liste les dernières parties d\'un joueur avec le score, les K/D/A et l\'agent joué.',
          usage:'/matches [riot_id] [mode] [limite]',
          cooldown:'8 s / utilisateur',
          params:[
            {name:'riot_id',type:'string',required:false,description:'Joueur à consulter. Par défaut, ton compte lié.'},
            {name:'mode',type:'choice',required:false,description:'Filtre sur un mode : competitive, unrated, swiftplay, deathmatch.',default:'tous les modes'},
            {name:'limite',type:'integer',required:false,description:'Nombre de parties à afficher, entre 1 et 10.',default:'5'}
          ],
          examples:[
            {code:'/matches limite:3',caption:'Les trois dernières parties'},
            {code:'/matches riot_id:Sage#EUW mode:competitive',caption:'Uniquement les parties classées'}
          ],
          returns:'<p>Une ligne par partie : carte, résultat, score d\'équipe, agent et K/D/A.</p>'
        },
        {
          id:'stats',
          title:'/stats',
          icon:'chart',
          summary:'Agrège les performances d\'un joueur sur une période : ratio, précision de visée et agents les plus joués.',
          usage:'/stats [riot_id] [période] [agent]',
          cooldown:'10 s / utilisateur',
          params:[
            {name:'riot_id',type:'string',required:false,description:'Joueur à analyser. Par défaut, ton compte lié.'},
            {name:'période',type:'choice',required:false,description:'Fenêtre d\'analyse : 7j, 30j ou saison.',default:'30j'},
            {name:'agent',type:'string',required:false,description:'Limite le calcul à un seul agent.'}
          ],
          examples:[
            {code:'/stats période:7j',caption:'Ta semaine'},
            {code:'/stats riot_id:Omen#EUW agent:Omen',caption:'Performances sur un agent précis'}
          ],
          returns:'<p>Un résumé chiffré : parties jouées, taux de victoire, K/D moyen, part de tirs à la tête et top trois des agents.</p>',
          notes:[{type:'info',text:'Les données sont mises en cache 15 minutes : une partie tout juste terminée peut manquer à l\'appel.'}]
        },
        {
          id:'leaderboard',
          title:'/leaderboard',
          icon:'user',
          summary:'Classe les membres du serveur qui ont lié leur compte, du rang le plus élevé au plus bas.',
          usage:'/leaderboard [région] [limite]',
          scope:'Serveur uniquement',
          cooldown:'30 s / serveur',
          params:[
            {name:'région',type:'choice',required:false,description:'Ne classe que les comptes d\'une région.',default:'toutes'},
            {name:'limite',type:'integer',required:false,description:'Nombre de joueurs affichés, entre 5 et 25.',default:'10'}
          ],
          examples:[{code:'/leaderboard limite:25',caption:'Classement complet du serveur'}],
          returns:'<p>Un classement numéroté avec le pseudo Discord, le rang et les RR de chaque membre lié.</p>'
        }
      ]
    },
    {
      group:'Jeu',
      items:[
        {
          id:'agent',
          title:'/agent',
          icon:'shield',
          summary:'Donne la fiche d\'un agent : rôle, compétences, coût des charges et temps de recharge.',
          usage:'/agent <nom>',
          cooldown:'3 s / utilisateur',
          params:[
            {name:'nom',type:'string',required:true,description:'Nom de l\'agent. L\'autocomplétion propose la liste complète.'}
          ],
          examples:[{code:'/agent nom:Killjoy',caption:'Fiche complète d\'un agent'}],
          returns:'<p>Le rôle, la description des quatre compétences et le coût en crédits des charges achetables.</p>'
        },
        {
          id:'maps',
          title:'/maps',
          icon:'map',
          summary:'Affiche la rotation de cartes active et le plan détaillé d\'une carte donnée.',
          usage:'/maps [nom]',
          cooldown:'3 s / utilisateur',
          params:[
            {name:'nom',type:'string',required:false,description:'Carte à détailler. Omis, la commande renvoie la rotation compétitive en cours.'}
          ],
          examples:[
            {code:'/maps',caption:'Rotation actuelle'},
            {code:'/maps nom:Ascent',caption:'Plan d\'une carte'}
          ]
        },
        {
          id:'store',
          title:'/store',
          icon:'shopping',
          summary:'Consulte la boutique quotidienne du compte lié et le temps restant avant sa rotation.',
          usage:'/store',
          scope:'Messages privés uniquement',
          cooldown:'1 utilisation / 60 s',
          permission:'Compte lié requis',
          examples:[{code:'/store',caption:'Ta boutique du jour'}],
          returns:'<p>Les quatre offres du jour avec leur prix en Valorant Points, plus le compte à rebours de rotation.</p>',
          notes:[{type:'warn',text:'Cette commande est refusée dans un salon de serveur : la boutique est une donnée personnelle et la réponse ne doit pas être publique.'}]
        }
      ]
    },
    {
      group:'Configuration',
      items:[
        {
          id:'notify',
          title:'/notify',
          icon:'bell',
          summary:'Envoie un message dans un salon quand un membre lié change de rang.',
          usage:'/notify <salon> [rôle] [seuil]',
          scope:'Serveur uniquement',
          permission:'Gérer le serveur',
          params:[
            {name:'salon',type:'channel',required:true,description:'Salon qui recevra les annonces de changement de rang.'},
            {name:'rôle',type:'role',required:false,description:'Rôle mentionné à chaque annonce.'},
            {name:'seuil',type:'choice',required:false,description:'Déclenche à chaque palier ou uniquement au changement de rang complet.',default:'rang complet'}
          ],
          examples:[{code:'/notify salon:#valorant rôle:@Joueurs',caption:'Annonces avec mention'}],
          notes:[{type:'info',text:'Relancer la commande sur un autre salon déplace les annonces au lieu de les dupliquer.'}]
        },
        {
          id:'config',
          title:'/config',
          icon:'settings',
          summary:'Règle la langue des réponses, le fuseau horaire et la visibilité par défaut des messages du bot.',
          usage:'/config <option> <valeur>',
          scope:'Serveur uniquement',
          permission:'Gérer le serveur',
          params:[
            {name:'option',type:'choice',required:true,description:'Réglage à modifier : langue, fuseau, visibilité.'},
            {name:'valeur',type:'string',required:true,description:'Nouvelle valeur. L\'autocomplétion propose les choix valides.'}
          ],
          examples:[
            {code:'/config option:langue valeur:fr',caption:'Passer les réponses en français'},
            {code:'/config option:visibilité valeur:éphémère',caption:'Réponses visibles du seul auteur'}
          ]
        },
        {
          id:'errors',
          title:'Codes d\'erreur',
          icon:'alert',
          summary:'La liste des erreurs renvoyées par le bot et ce qu\'il faut faire dans chaque cas.',
          body:`
          <h2>Erreurs de compte</h2>
          <ul>
            <li><code>NO_LINKED_ACCOUNT</code> — aucun compte lié. Lance <code>/link</code> une première fois.</li>
            <li><code>RIOT_ID_NOT_FOUND</code> — le pseudo#tag n'existe pas sur la région demandée. Vérifie la casse et le tag.</li>
            <li><code>UNRANKED</code> — le joueur n'a pas terminé ses parties de placement sur la saison.</li>
          </ul>
          <h2>Erreurs de service</h2>
          <ul>
            <li><code>RATE_LIMITED</code> — trop d'appels d'affilée. Le message indique le délai d'attente restant.</li>
            <li><code>RIOT_API_DOWN</code> — l'API Riot ne répond pas. Rien à faire côté serveur, réessaie plus tard.</li>
            <li><code>MISSING_PERMISSIONS</code> — le bot ne peut pas écrire ou intégrer un lien dans ce salon.</li>
          </ul>
        `,
          notes:[{type:'info',text:'Chaque erreur affichée dans Discord reprend ce code : cherche-le sur cette page pour trouver la marche à suivre.'}]
        },
        {
          id:'ratelimit',
          title:'Limites d\'appel',
          icon:'clock',
          summary:'Les quotas appliqués par utilisateur et par serveur pour rester dans les limites de l\'API Riot.',
          body:`
          <h2>Comment ça marche</h2>
          <p>Chaque commande a son propre compteur, remis à zéro à la fin de sa fenêtre. Atteindre la limite d'une commande ne bloque pas les autres.</p>
          <ul>
            <li><strong>Par utilisateur</strong> — 20 commandes par minute, tous salons confondus.</li>
            <li><strong>Par serveur</strong> — 120 commandes par minute.</li>
            <li><strong>Commandes lourdes</strong> — <code>/stats</code> et <code>/leaderboard</code> comptent pour trois appels.</li>
          </ul>
          <p>En cas de dépassement, le bot répond <code>RATE_LIMITED</code> avec le temps d'attente exact au lieu d'ignorer la commande.</p>
        `
        }
      ]
    }
  ];

  const FLAT = DOCS.flatMap(g => g.items.map(it => ({...it, group:g.group})));
  const byId = id => FLAT.find(i => i.id === id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function hlCommand(str){
    return esc(str)
            .replace(/^(\/[\w-]+)/, '<span class="cmd">$1</span>')
            .replace(/(&lt;[^&]+&gt;|\[[^\]]+\])/g, '<span class="arg">$1</span>');
  }

  function codeBlock(code, caption, highlight){
    const body = highlight ? hlCommand(code) : esc(code);
    return `<div class="code">
    ${caption ? `<div class="code-cap">${icon('terminal')}${esc(caption)}</div>` : ''}
    <button class="code-copy" data-copy="${esc(code)}" title="Copier" aria-label="Copier">${icon('copy')}</button>
    <pre>${body}</pre>
  </div>`;
  }

  function renderNav(filter=''){
    const q = filter.trim().toLowerCase();
    const nav = document.getElementById('nav');
    let html = '', hits = 0;

    DOCS.forEach(group => {
      const items = group.items.filter(it =>
              !q ||
              it.title.toLowerCase().includes(q) ||
              (it.summary||'').toLowerCase().includes(q) ||
              (it.usage||'').toLowerCase().includes(q)
      );
      if (!items.length) return;
      hits += items.length;
      html += `<div class="nav-group"><h4>${esc(group.group)}</h4>` +
              items.map(it => `<a class="nav-item" href="#${it.id}" data-id="${it.id}">
        ${icon(it.icon)}<span>${esc(it.title)}</span></a>`).join('') +
              `</div>`;
    });

    nav.innerHTML = hits ? html : `<p class="nav-empty">Aucune commande ne correspond à « ${esc(filter)} ».</p>`;
    markActive();
  }

  function markActive(){
    const id = location.hash.slice(1) || FLAT[0].id;
    document.querySelectorAll('.nav-item').forEach(a =>
            a.classList.toggle('active', a.dataset.id === id));
  }

  function renderPage(){
    const id = location.hash.slice(1) || FLAT[0].id;
    const d = byId(id) || FLAT[0];
    const i = FLAT.indexOf(d);
    const prev = FLAT[i-1], next = FLAT[i+1];
    let h = '';

    h += `<p class="eyebrow">${esc(d.group)}</p>`;
    h += `<div class="page-head"><h1>${d.title.startsWith('/')
            ? '<span class="slash">/</span>'+esc(d.title.slice(1))
            : esc(d.title)}</h1>
        <button class="copy-page" data-copy="${esc(d.usage || d.title)}">${icon('copy')}Copier</button></div>`;

    if (d.summary) h += `<p class="summary">${d.summary}</p>`;

    const chips = [];
    if (d.cooldown)   chips.push(`<span class="chip">${icon('clock')}${esc(d.cooldown)}</span>`);
    if (d.scope)      chips.push(`<span class="chip">${icon('book')}${esc(d.scope)}</span>`);
    if (d.permission) chips.push(`<span class="chip accent">${icon('shield')}${esc(d.permission)}</span>`);
    if (chips.length) h += `<div class="meta-row">${chips.join('')}</div>`;

    h += `<div class="prose">`;

    if (d.usage){
      h += `<h2>Syntaxe</h2>` + codeBlock(d.usage, null, true);
    }

    if (d.params && d.params.length){
      h += `<h2>Paramètres</h2><div class="params">` + d.params.map(p => `
      <div class="param">
        <div class="param-head">
          <span class="param-name">${esc(p.name)}</span>
          <span class="param-type">${esc(p.type)}</span>
          <span class="tag ${p.required?'req':'opt'}">${p.required?'requis':'optionnel'}</span>
        </div>
        <p>${p.description}</p>
        ${p.default ? `<p class="def">Par défaut : <code>${esc(p.default)}</code></p>` : ''}
      </div>`).join('') + `</div>`;
    }

    if (d.examples && d.examples.length){
      h += `<h2>Exemples</h2>` + d.examples.map(ex => codeBlock(ex.code, ex.caption, true)).join('');
    }

    if (d.returns) h += `<h2>Réponse du bot</h2>${d.returns}`;
    if (d.body)    h += d.body;

    if (d.notes && d.notes.length){
      h += d.notes.map(n => {
        const kind = n.type === 'warn' ? 'warn' : n.type === 'ok' ? 'ok' : '';
        const ico  = n.type === 'warn' ? 'alert' : n.type === 'ok' ? 'check' : 'info';
        return `<div class="callout ${kind}">${icon(ico)}<div>${n.text}</div></div>`;
      }).join('');
    }

    h += `</div>`;

    h += `<nav class="pager">`;
    h += prev ? `<a href="#${prev.id}"><span class="lbl">${icon('left')}Précédent</span>
               <span class="ttl">${esc(prev.title)}</span></a>` : `<span style="flex:1"></span>`;
    h += next ? `<a class="next" href="#${next.id}"><span class="lbl">Suivant${icon('right')}</span>
               <span class="ttl">${esc(next.title)}</span></a>` : `<span style="flex:1"></span>`;
    h += `</nav>`;

    h += `<div class="page-foot"><span>ValoBot — documentation des commandes</span>
        <span class="right">Mis à jour le 16.09.2026</span></div>`;

    const page = document.getElementById('page');
    page.innerHTML = h;
    document.title = d.title + ' - ValoBot';
    window.scrollTo(0,0);
    document.body.classList.remove('nav-open');
    markActive();
  }

  /* copie */
  document.addEventListener('click', e => {
    const btn = e.target.closest('[data-copy]');
    if (!btn) return;
    navigator.clipboard.writeText(btn.dataset.copy).then(() => {
      const old = btn.innerHTML;
      const label = btn.classList.contains('copy-page');
      btn.innerHTML = icon('check') + (label ? 'Copié' : '');
      setTimeout(() => btn.innerHTML = old, 1600);
    }).catch(()=>{});
  });

  /* recherche */
  const search = document.getElementById('search');
  search.addEventListener('input', e => renderNav(e.target.value));
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
      e.preventDefault(); search.focus(); document.body.classList.add('nav-open');
    }
    if (e.key === 'Escape') { search.blur(); document.body.classList.remove('nav-open'); }
  });

  /* thème */
  function setTheme(t){
    document.documentElement.dataset.theme = t;
    document.getElementById('themeDark').classList.toggle('on', t === 'dark');
    document.getElementById('themeLight').classList.toggle('on', t === 'light');
    try { localStorage.setItem('valobot-theme', t); } catch(_){}
  }
  document.getElementById('themeDark').onclick  = () => setTheme('dark');
  document.getElementById('themeLight').onclick = () => setTheme('light');

  /* nav mobile */
  document.getElementById('burger').onclick = () => document.body.classList.toggle('nav-open');
  document.getElementById('scrim').onclick  = () => document.body.classList.remove('nav-open');

  /* init */
  document.getElementById('brandMark').innerHTML = icon('crosshair');
  document.getElementById('searchIcon').innerHTML = icon('search');
  document.getElementById('burger').innerHTML = icon('menu');
  document.getElementById('themeDark').innerHTML = icon('moon');
  document.getElementById('themeLight').innerHTML = icon('sun');

  let saved = 'dark';
  try { saved = localStorage.getItem('valobot-theme') || 'dark'; } catch(_){}
  setTheme(saved);

  renderNav();
  renderPage();
  window.addEventListener('hashchange', renderPage);
</script>
</body>
</html>
